adding:8px max(8px,env(safe-area-inset-left)) max(8px,env(safe-area-inset-bottom));z-index:20}.tab{background:#159fd3;color:white;border-radius:15px;padding:10px 5px;font-weight:800;min-height:62px}.tab.active{background:#42c6ef;color:#062033}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:11px;border-bottom:1px solid var(--line);text-align:left}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#24506b}.list{display:grid;gap:9px}.item{background:#173d57;padding:13px;border-radius:14px}.map{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.slot{min-height:105px;background:#204a63;border-radius:14px;padding:12px;cursor:pointer}.slot.ok{border:2px solid var(--ok)}.slot.warn{border:2px solid var(--warn)}.slot.bad{border:2px solid var(--bad)}.slot .code{font-weight:900}.warehouse3d{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;align-items:end;min-height:250px;padding:12px;background:#0b2638;border-radius:18px;perspective:700px}.tower{display:flex;flex-direction:column-reverse;gap:4px;transform:rotateX(7deg)}.level{height:48px;border-radius:7px;background:#25526b;padding:6px;font-size:11px;overflow:hidden}.level.occupied{background:#18799d}.level.risk{background:#8a5b20}.level.blocked{background:#7d3542}.login{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:50px 18px}.login .card{width:100%;max-width:600px}.login .brand{display:block;margin-bottom:25px}.login h1{font-size:36px}.camera{display:none;background:#000;border-radius:15px;overflow:hidden;margin:10px 0}.camera video{width:100%;display:block}.hidden{display:none!important}.sectiontitle{display:flex;justify-content:space-between;align-items:center;gap:10px}.chart{display:flex;align-items:end;gap:9px;height:180px;padding-top:20px}.bar{flex:1;background:var(--cyan);border-radius:8px 8px 3px 3px;min-width:12px}.bar small{display:block;text-align:center;transform:translateY(20px);color:var(--muted)}.search{position:sticky;top:88px;z-index:5}.hero{background:linear-gradient(135deg,#123b56,#0c2940);border:1px solid #28536d}.dangerbox{border:1px solid #6b3440}.successbox{border:1px solid #236e57}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.top{padding-top:20px}.brand h1{font-size:26px}.userbox span{display:none}.map,.warehouse3d{grid-template-columns:repeat(2,1fr)}.main{padding:12px}.card{padding:17px;border-radius:19px}}
</style></head><body><div id="root"></div><script>
const KEY='opera_v18_state';
const seed={users:[{id:'u1',user:'joao',name:'João',role:'OPERADOR',pass:'1234'},{id:'u2',user:'ana',name:'Ana',role:'CHECK360',pass:'1234'},{id:'u3',user:'maria',name:'Maria',role:'SUPERVISOR',pass:'1234'},{id:'u4',user:'admin',name:'Administrador',role:'ADMIN',pass:'1234'}],pallets:[

{code:'P00140',product:'SKU350',lot:'L20261008-B',qty:100,origin:'Extrema',carrier:'Transportadora Demo',expiry:'2027-01-10',status:'PENDING'},

{code:'A03-02-04',capacity:2,occ:0},{code:'A03-02-05',capacity:2,occ:0},{code:'A03-02-06',capacity:2,occ:0},{code:'B01-01-02',capacity:1,occ:0},{code:'B01-01-03',capacity:1,occ:0},{code:'B02-01-01',capacity:2,occ:0},{code:'C01-02-01',capacity:2,occ:0},{code:'C02-02-01',capacity:2,occ:0}],demands:[],events:[],checks:[],evidence:[],loads:[{id:'D-1001',date:'2026-10-08',origin:'Extrema',carrier:'Transportadora Demo',total:4,good:0,bad:0,pnc:0,rework:0,photos:[]}],session:null};
let S=JSON.parse(localStorage.getItem(KEY)||'null')||seed;
function save(){localStorage.setItem(KEY,JSON.stringify(S))}function now(){return new Date().toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}function uid(p='E'){return p+Date.now()+Math.random().toString(16).slice(2)}function me(){return S.users.find(x=>x.user===S.session)}function role(...r){return me()&&r.includes(me().role)}function can(view){if(!me())return false;const m={home:['OPERADOR','CHECK360','SUPERVISOR','ADMIN'],op:['OPERADOR','SUPERVISOR','ADMIN'],check:['CHECK360','SUPERVISOR','ADMIN'],data:['OPERADOR','CHECK360','SUPERVISOR','ADMIN'],admin:['ADMIN']};return m[view]?.includes(me().role)}
function header(){const u=me();return `<header class="top"><div class="brand"><div><h1>OPERA V18</h1><p>Torre de Controle • Recebimento, Guarda e Rastreabilidade</p></div>${u?`<div class="userbox"><span>👤 ${u.name} • ${u.role}</span><button class="logout" onclick="logout()">Sair</button></div>`:''}</div></header>`}
function nav(active){const items=[['home','🏠','Início'],['op','📦','Operação'],['check','🔎','Check 360'],['data','📊','Dados'],['admin','⚙️','Admin']];return `<nav class="tabs">${items.filter(x=>can(x[0])).map(x=>`<button class="tab ${active===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}<br>${x[2]}</button>`).join('')}</nav>`}
function layout(content,active){document.getElementById('root').innerHTML=header()+`<main class="main">${content}</main>`+nav(active)}
function login(){document.getElementById('root').innerHTML=`<div class="login"><div class="card hero"><div class="brand"><h1>OPERA V18</h1><p>Torre de Controle Operacional</p></div><h2>Entrar</h2><input id="lu" class="field" placeholder="Usuário" autocomplete="username"><input id="lp" class="field" type="password" placeholder="Senha" autocomplete="current-password"><button class="btn" onclick="doLogin()">Entrar</button><div id="lm" class="msg"></div><hr style="border-color:#244a63;margin:22px 0"><div class="muted">Teste: joao / 1234 • ana / 1234 • maria / 1234 • admin / 1234</div></div></div>`}
function doLogin(){const u=S.users.find(x=>x.user===lu.value.trim()&&x.pass===lp.value);if(!u){lm.textContent='Usuário ou senha inválidos.';lm.className='msg bad';return}S.session=u.user;save();go('home')}
function logout(){S.session=null;save();login()}
function go(v){if(!can(v)){home();return}({home,op,check,data,admin}[v])()}
function home(){const p=S.pallets,open=S.demands.filter(d=>d.status==='OPEN').length,stored=p.filter(x=>x.status==='STORED').length,pnc=p.filter(x=>x.status==='PNC').length,rework=p.filter(x=>x.status==='RETRABALHO').length;layout(`<div class="card hero"><div class="sectiontitle"><div><h2>Torre de Controle</h2><p class="muted">Visão operacional em tempo real no celular</p></div><span class="pill">${me().role}</span></div><div class="grid"><div class="metric"><b>${p.length}</b><span>Pallets cadastrados</span></div><div class="metric"><b>${open}</b><span>Aguardando guarda</span></div><div class="metric"><b>${stored}</b><span>Armazenados</span></div><div class="metric"><b>${pnc}</b><span>PNC</span></div></div></div><div class="card"><h2>Status operacional</h2><div class="grid"><div class="metric"><b>${rework}</b><span>Retrabalho</span></div><div class="metric"><b>${S.checks.length}</b><span>Checks realizados</span></div><div class="metric"><b>${S.events.length}</b><span>Eventos auditáveis</span></div><div class="metric"><b>${S.demands.length}</b><span>Demandas geradas</span></div></div></div><div class="card"><h2>Acesso rápido</h2><div class="actions">${can('check')?'<button class="btn" onclick="go(\'check\')">🔎 Check 360</button>':''}${can('op')?'<button class="btn" onclick="go(\'op\')">📦 Guardas</button>':''}<button class="btn" onclick="go('data')">📊 Dados</button><button class="btn secondary" onclick="timelinePrompt()">🔍 Pesquisar pallet</button></div></div>`, 'home')}
function op(){const open=S.demands.filter(d=>d.status==='OPEN');const months=[...new Set(S.pallets.map(p=>p.expiry.slice(0,7)))];layout(`<div class="card"><div class="sectiontitle"><h2>📦 Operação / Guarda</h2><span class="pill">${open.length} pendentes</span></div><div class="row"><div><label class="muted">Filtrar mês de validade</label><select id="month" class="field"><option value="">Todos</option>${months.map(m=>`<option>${m}</option>`).join('')}</select></div><div><label class="muted">Pesquisar lote</label><input id="lotsearch" class="field" placeholder="Lote..." oninput="renderDemands()"></div></div><div id="demands" class="list"></div></div><div class="card"><h2>Scanner / Guarda</h2><button class="btn" onclick="openCamera()">📷 Abrir câmera</button><video id="video" class="camera" playsinline></video><div class="row"><input id="pallet" class="field" placeholder="Pallet (ex.: P00140)"><input id="addr" class="field" placeholder="Endereço (ex.: A03-02-05)"></div><button class="btn" onclick="guard()">Confirmar Guarda</button><div id="gm" class="msg"></div></div>`, 'op');renderDemands()}
function renderDemands(){const el=document.getElementById('demands');if(!el)return;const m=document.getElementById('month').value,l=(document.getElementById('lotsearch').value||'').toLowerCase();const ds=S.demands.filter(d=>d.status==='OPEN').filter(d=>!m||d.expiry.startsWith(m)).filter(d=>!l||d.lot.toLowerCase().includes(l));el.innerHTML=ds.length?ds.map(d=>`<div class="item"><b>${d.pallet}</b> • Lote ${d.lot}<br><span class="muted">${d.qty} un • validade ${d.expiry} • sugestão ${d.address}</span><br><button class="btn small" onclick="useDemand('${d.pallet}','${d.address}')">Usar demanda</button></div>`).join(''):'<div class="muted">Nenhuma demanda aberta.</div>';document.getElementById('month').onchange=renderDemands}
function useDemand(p,a){document.getElementById('pallet').value=p;document.getElementById('addr').value=a;window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function guard(){if(!role('OPERADOR','SUPERVISOR','ADMIN'))return msg('gm','Seu perfil não pode executar guarda.','bad');const pc=pallet.value.trim().toUpperCase(),ac=addr.value.trim().toUpperCase();const p=S.pallets.find(x=>x.code===pc),a=S.addresses.find(x=>x.code===ac),d=S.demands.find(x=>x.pallet===pc&&x.status==='OPEN');if(!p||!a||!d)return msg('gm','Demanda/endereço não encontrado.','bad');if(p.status!=='CHECK360_OK')return msg('gm','Pallet não está liberado no Check 360.','bad');if(a.occ>=a.capacity)return msg('gm','Endereço sem capacidade.','bad');if(d.address!==ac)return msg('gm',`Endereço incorreto. Sugestão: ${d.address}`,'bad');p.status='STORED';p.address=ac;d.status='DONE';d.doneBy=me().name;d.doneAt=now();a.occ++;S.events.push({id:uid(),pallet:pc,type:'GUARDA_CONFIRMADA',user:me().name,role:me().role,at:now(),address:ac,lot:p.lot});save();msg('gm',`Guarda confirmada. Responsável: ${me().name}.`,'ok');renderDemands()}
let stream=null;async function openCamera(){const v=document.getElementById('video');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;v.style.display='block';await v.play();if('BarcodeDetector'in window){const det=new BarcodeDetector({formats:['code_128','ean_13','ean_8','qr_code']});const scan=async()=>{if(!stream)return;try{const codes=await det.detect(v);if(codes[0]){pallet.value=codes[0].rawValue.toUpperCase();stopCamera();}}catch(e){}requestAnimationFrame(scan)};scan()}else msg('gm','Leitor automático não suportado neste navegador. Use a digitação manual.','warn')}catch(e){msg('gm','Câmera não autorizada ou indisponível.','bad')}}function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}const v=document.getElementById('video');if(v)v.style.display='none'}
function check(){if(!role('CHECK360','SUPERVISOR','ADMIN'))return layout(`<div class="card dangerbox"><h2>Acesso restrito</h2><p>Seu perfil não pode executar o Check 360.</p></div>`,'home');layout(`<div class="card"><h2>🔎 Check 360</h2><div class="row"><input id="cp" class="field" placeholder="Pallet"><input id="origin" class="field" placeholder="Origem / descarga"></div><div class="row"><input id="carrier" class="field" placeholder="Transportadora"><input id="qty" class="field" type="number" placeholder="Quantidade de pallets"></div><select id="result" class="field"><option>OK</option><option>RETRABALHO</option><option>PNC</option><option>DIVERGENCIA</option></select><input id="obs" class="field" placeholder="Observação"><div class="actions"><button class="btn" onclick="doCheck()">Registrar Check 360</button><button class="btn secondary" onclick="photoEvidence()">📸 Adicionar foto</button></div><div id="cm" class="msg"></div></div><div class="card"><h2>Resumo da conferência</h2><div class="grid"><div class="metric"><b>${S.pallets.filter(p=>p.status==='CHECK360_OK').length}</b><span>Paletes bons</span></div><div class="metric"><b>${S.pallets.filter(p=>p.status==='RETRABALHO').length}</b><span>Retrabalho</span></div><div class="metric"><b>${S.pallets.filter(p=>p.status==='PNC').length}</b><span>PNC</span></div><div class="metric"><b>${S.pallets.length}</b><span>Total pallets</span></div></div></div>`, 'check')}
function doCheck(){const pc=cp.value.trim().toUpperCase(),r=result.value,p=S.pallets.find(x=>x.code===pc);if(!p)return msg('cm','Pallet não encontrado.','bad');p.status=r==='OK'?'CHECK360_OK':r;const a=S.addresses.find(x=>x.occ<x.capacity);if(r==='OK'&&!S.demands.some(d=>d.pallet===pc&&d.status==='OPEN'))S.demands.push({id:uid('D'),pallet:pc,lot:p.lot,qty:p.qty,expiry:p.expiry,address:a?.code||null,status:'OPEN',createdBy:me().name,createdAt:now()});S.checks.push({id:uid('C'),pallet:pc,result:r,user:me().name,role:me().role,at:now(),origin:origin.value,carrier:carrier.value,qty:qty.value,obs:obs.value});S.events.push({id:uid(),pallet:pc,type:'CHECK_360',user:me().name,role:me().role,at:now(),result:r});save();msg('cm',`Check 360 registrado por ${me().name}. ${r==='OK'?'Demanda de guarda criada.':''}`,'ok');check()}
function photoEvidence(){const pc=prompt('Pallet da evidência:');if(!pc)return;const desc=prompt('Descrição da foto/evidência:')||'Evidência registrada';S.evidence.push({id:uid('F'),pallet:pc.toUpperCase(),user:me().name,at:now(),description:desc,photoStatus:'REGISTRADA'});S.events.push({id:uid(),pallet:pc.toUpperCase(),type:'EVIDENCIA',user:me().name,role:me().role,at:now(),description:desc});save();msg('cm',`Evidência registrada por ${me().name}.`,'ok')}
function data(){const stored=S.pallets.filter(p=>p.status==='STORED').length,open=S.demands.filter(d=>d.status==='OPEN').length,checks=S.checks.length;const byUser={};S.events.forEach(e=>byUser[e.user]=(byUser[e.user]||0)+1);const max=Math.max(1,...Object.values(byUser));layout(`<div class="card"><div class="sectiontitle"><h2>📊 Dados & BI</h2><input id="globalSearch" class="field search" style="max-width:300px" placeholder="Pesquisar pallet/lote..." oninput="searchAll()"></div><div class="grid"><div class="metric"><b>${stored}</b><span>Armazenados</span></div><div class="metric"><b>${open}</b><span>Para guardar</span></div><div class="metric"><b>${checks}</b><span>Checks</span></div><div class="metric"><b>${S.events.length}</b><span>Eventos</span></div></div></div><div class="card"><h2>Produtividade / eventos por usuário</h2><div class="chart">${Object.entries(byUser).map(([u,n])=>`<div class="bar" style="height:${Math.max(15,n/max*140)}px"><small>${u}</small></div>`).join('')||'<span class="muted">Sem eventos ainda.</span>'}</div></div><div class="card"><h2>🗺️ Mapa do armazém</h2><div class="map">${S.addresses.map(a=>`<div class="slot ${a.occ>=a.capacity?'bad':a.occ?'warn':'ok'}" onclick="slotDetail('${a.code}')"><div class="code">${a.code}</div><div>${a.occ}/${a.capacity} pallets</div><div class="muted">${S.pallets.filter(p=>p.address===a.code).map(p=>p.lot).join(', ')||'Livre'}</div></div>`).join('')}</div></div><div class="card"><h2>🧊 Visão 3D do armazém</h2><p class="muted">Representação operacional preparada para cadastrar ruas, módulos, níveis e posições reais.</p><div class="warehouse3d">${S.addresses.slice(0,4).map(a=>`<div class="tower">${[1,2,3].map(n=>`<div class="level ${a.occ>=a.capacity?'blocked':a.occ?'occupied':''}">${a.code}<br>Nível ${n}</div>`).join('')}</div>`).join('')}</div></div><div class="card"><h2>📋 Rastreabilidade</h2><div id="results" class="list">${auditRows()}</div></div>`, 'data')}
function auditRows(){return S.events.slice().reverse().slice(0,50).map(e=>`<div class="item"><b>${e.pallet||'-'}</b> • ${e.type}<br><span class="muted">Responsável: <strong>${e.user}</strong> • ${e.at}${e.address?' • '+e.address:''}${e.result?' • '+e.result:''}</span></div>`).join('')||'<div class="muted">Nenhum evento registrado.</div>'}
function searchAll(){const q=(document.getElementById('globalSearch').value||'').toLowerCase();const r=document.getElementById('results');if(!q){r.innerHTML=auditRows();return}const ps=S.pallets.filter(p=>JSON.stringify(p).toLowerCase().includes(q));r.innerHTML=ps.length?ps.map(p=>`<div class="item"><b>${p.code}</b> • ${p.product} • Lote ${p.lot}<br><span class="muted">Status: ${p.status} • Endereço: ${p.address||'-'}</span><br><button class="btn small" onclick="timeline('${p.code}')">Ver histórico completo</button></div>`).join(''):'<div class="muted">Nada encontrado.</div>'}
function timelinePrompt(){const p=prompt('Digite o pallet:');if(p)timeline(p.toUpperCase())}function timeline(code){const p=S.pallets.find(x=>x.code===code),ev=S.events.filter(e=>e.pallet===code),ch=S.checks.filter(e=>e.pallet===code),de=S.demands.filter(e=>e.pallet===code);if(!p){alert('Pallet não encontrado');return}alert(`Pallet ${p.code}\nLote: ${p.lot}\nStatus: ${p.status}\nEndereço: ${p.address||'-'}\n\nChecks: ${ch.map(x=>x.result+' por '+x.user+' em '+x.at).join('\n')||'-'}\n\nDemandas: ${de.map(x=>x.status+' • '+x.address).join('\n')||'-'}\n\nEventos: ${ev.map(x=>x.type+' • '+x.user+' • '+x.at).join('\n')||'-'}`)}function slotDetail(c){const a=S.addresses.find(x=>x.code===c),ps=S.pallets.filter(p=>p.address===c);alert(`${c}\nOcupação: ${a.occ}/${a.capacity}\n\n${ps.map(p=>p.code+' • '+p.lot+' • '+p.qty+' un').join('\n')||'Endereço livre'}`)}
function admin(){if(!role('ADMIN'))return go('home');layout(`<div class="card"><h2>⚙️ Administração</h2><p class="muted">Perfis e permissões. Usuários não executam funções fora do seu perfil.</p><div class="tablewrap"><table class="table"><tr><th>Usuário</th><th>Nome</th><th>Perfil</th><th>Permissões</th></tr>${S.users.map(u=>`<tr><td>${u.user}</td><td>${u.name}</td><td>${u.role}</td><td>${u.role==='ADMIN'?'Tudo':u.role==='CHECK360'?'Check 360 + Dados':u.role==='SUPERVISOR'?'Operação + Check + Dados':'Operação + Dados'}</td></tr>`).join('')}</table></div></div><div class="card"><h2>Backup local</h2><button class="btn" onclick="backup()">⬇️ Exportar JSON</button> <label class="btn secondary" style="display:inline-block">⬆️ Importar JSON<input type="file" accept="application/json" hidden onchange="restore(event)"></label><button class="btn danger" onclick="resetDemo()">Resetar dados de teste</button></div>`, 'admin')}
function backup(){const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='opera-v18-backup.json';a.click();URL.revokeObjectURL(a.href)}function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();alert('Backup importado.');go('home')}catch(x){alert('Arquivo inválido.')}};r.readAsText(f)}function resetDemo(){if(confirm('Resetar os dados locais de teste?')){localStorage.removeItem(KEY);location.reload()}}function msg(id,t,c){const e=document.getElementById(id);if(e){e.textContent=t;e.className='msg '+c}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});if(S.session)home();else login();
</script></body></html>
